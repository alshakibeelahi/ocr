# =============================================================================
# OCR / PI Data Extraction - PRODUCTION stack
#
#   Everything (app + Ollama) runs in Docker. CPU vs GPU is chosen ONLY in
#   .env via COMPOSE_PROFILES:
#       cpu   - no GPU
#       gpu   - NVIDIA GPU (nvidia driver + nvidia-container-toolkit required)
#       rocm  - AMD/Radeon GPU (Linux host with amdgpu driver)
#
#   Run from this folder:
#       docker compose up -d --build
#
#   Exactly one ollama-* service starts, selected by the profile. All three
#   share the same container name and data volume (YAML anchors keep the
#   common config in sync).
# =============================================================================

x-ollama-common: &ollama-common
  container_name: ocr-ollama
  volumes:
    - ollama_data:/root/.ollama
  environment: &ollama-env
    OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    # Low-VRAM optimizations (2-4 GB cards); harmless on big GPUs and CPU.
    OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
    OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
  networks:
    ocr:
      aliases: [ocr-ollama-host]
  healthcheck:
    test: ["CMD", "ollama", "list"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s
  restart: unless-stopped

services:

  # ---- CPU mode (COMPOSE_PROFILES=cpu) --------------------------------------
  ollama-cpu:
    <<: *ollama-common
    profiles: [cpu]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}

  # ---- NVIDIA GPU mode (COMPOSE_PROFILES=gpu) -------------------------------
  # Requires NVIDIA driver + nvidia-container-toolkit on the host.
  ollama-gpu:
    <<: *ollama-common
    profiles: [gpu]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]

  # ---- AMD GPU mode (COMPOSE_PROFILES=rocm) ---------------------------------
  # Requires amdgpu kernel driver on the host (Linux only).
  # For older Radeon cards set HSA_OVERRIDE_GFX_VERSION in .env
  # (e.g. 10.3.0 for RX 6000 series).
  ollama-rocm:
    <<: *ollama-common
    profiles: [rocm]
    image: ${OLLAMA_IMAGE_ROCM:-ollama/ollama:rocm}
    devices:
      - /dev/kfd
      - /dev/dri
    environment:
      <<: *ollama-env
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-}

  # Pulls the vision model and the v2 embedding model on first start (each
  # skipped when already present, e.g. with a bundled image).
  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: ocr-ollama-init
    environment:
      OLLAMA_HOST: http://ocr-ollama-host:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:3b}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-nomic-embed-text}
    networks: [ocr]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'sleep 5; for m in "$$OLLAMA_MODEL" "$$AI_EMBEDDING_MODEL"; do if ollama list | grep -q "$$m"; then echo "Model already present: $$m"; else echo "Pulling model: $$m" && ollama pull "$$m"; fi; done && ollama list'
    restart: "no"

  # ---- PostgreSQL + pgvector (v2 only) --------------------------------------
  # Holds the knowledge base, its vector index, the extraction audit trail and
  # the result cache. v1 does not use it at all: to run v1 without this service,
  # start the app with SPRING_PROFILES_ACTIVE=lite.
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    container_name: ocr-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ocr}
      POSTGRES_USER: ${POSTGRES_USER:-ocr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [ocr]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ocr} -d $${POSTGRES_DB:-ocr}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ocr-app:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: ..
      dockerfile: Dockerfile
    image: ocr-app:${VERSION:-latest}
    container_name: ocr-app
    ports:
      - "${OCR_APP_PORT:-8080}:8080"
    environment:
      OLLAMA_BASE_URL: http://ocr-ollama-host:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:3b}
      OLLAMA_IDLE_TIMEOUT: ${OLLAMA_IDLE_TIMEOUT:-10m}
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-30m}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OCR_RENDER_DPI: ${OCR_RENDER_DPI:-200}
      OCR_MAX_IMAGE_DIMENSION: ${OCR_MAX_IMAGE_DIMENSION:-1536}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-50MB}
      CALLBACK_AUTH_REQUIRED: ${CALLBACK_AUTH_REQUIRED:-true}
      CALLBACK_AUTH_TOKEN_URL: ${CALLBACK_AUTH_TOKEN_URL:-}
      CALLBACK_AUTH_CLIENT_ID: ${CALLBACK_AUTH_CLIENT_ID:-}
      CALLBACK_AUTH_CLIENT_SECRET: ${CALLBACK_AUTH_CLIENT_SECRET:-}
      CALLBACK_AUTH_SCOPE: ${CALLBACK_AUTH_SCOPE:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}

      # --- v2: database ---------------------------------------------------
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ocr}
      POSTGRES_USER: ${POSTGRES_USER:-ocr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocr}

      # --- v2: knowledge base ---------------------------------------------
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-ollama}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-nomic-embed-text}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-768}
      AI_RAG_ENABLED: ${AI_RAG_ENABLED:-true}

      # --- v2: optional cloud providers (blank = disabled) ------------------
      AI_OPENAI_ENABLED: ${AI_OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      AI_ANTHROPIC_ENABLED: ${AI_ANTHROPIC_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      AI_AZURE_ENABLED: ${AI_AZURE_ENABLED:-false}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AI_VERTEX_ENABLED: ${AI_VERTEX_ENABLED:-false}
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      VERTEX_MODEL: ${VERTEX_MODEL:-gemini-2.5-pro}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      AI_BEDROCK_ENABLED: ${AI_BEDROCK_ENABLED:-false}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      BEDROCK_MODEL: ${BEDROCK_MODEL:-}
      AI_GROQ_ENABLED: ${AI_GROQ_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_DEEPSEEK_ENABLED: ${AI_DEEPSEEK_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_MISTRAL_ENABLED: ${AI_MISTRAL_ENABLED:-false}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    networks: [ocr]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v2/pi-extraction/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

networks:
  ocr:
    driver: bridge

volumes:
  ollama_data:
  postgres_data:
