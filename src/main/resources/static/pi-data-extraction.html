<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PI Data Extraction - Ollama Vision</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>PI Data Extraction</h1>
            <p class="subtitle">Upload one or multiple PI/trade documents. The job runs in the background and posts the result to your callback URL.</p>
            <nav class="app-nav" aria-label="Document tools">
                <a href="/">OCR</a>
                <a class="active" href="/pi-data-extraction.html">PI Data Extraction</a>
            </nav>
        </header>

        <section id="readinessSection" class="readiness-section hidden">
            <p id="readinessText"></p>
        </section>

        <section class="upload-section">
            <form id="uploadForm">
                <label class="file-label" for="pdfFile">
                    <span id="fileLabel">Choose PI PDF or image</span>
                    <input type="file" id="pdfFile" accept="application/pdf,image/png,image/jpeg" required>
                </label>
                <input
                        type="url"
                        id="callbackUrl"
                        name="callbackUrl"
                        placeholder="Callback URL"
                        required
                >
                <button type="submit" id="submitBtn">Start Extraction Job</button>
            </form>
        </section>

        <section id="statusSection" class="status-section hidden">
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <p id="statusText" class="status-text">Waiting...</p>
        </section>

        <section id="resultsSection" class="results-section hidden">
            <div class="results-header">
                <h2>Extracted Data</h2>
                <button id="downloadBtn" class="secondary-btn hidden">Download JSON</button>
            </div>
            <div id="pagesContainer"></div>
        </section>

        <section id="errorSection" class="error-section hidden">
            <p id="errorText"></p>
        </section>
    </main>
    <script src="/pi-data-extraction.js"></script>
</body>
</html>
